  # ---- Depuración activa en producción --------------------------------
  # -------------------------------------------------------------------
  # Mas paneles y paginas de estado de terceros en su ruta por defecto.
  # Misma regla que los de arriba: el codigo de estado nunca basta solo, y
  # cada condicion va en su propio matcher (dentro de un matcher "word", las
  # palabras se combinan con OR). Todo son GET de lectura.
  # -------------------------------------------------------------------
  # Grafana con acceso anonimo: /api/org solo contesta sin sesion si
  # auth.anonymous esta activo; si no, 401. zipCode es un campo de la
  # direccion de la organizacion que devuelve Grafana y no un JSON cualquiera.
  - id: grafana-anonymous-access
    version: 1
    type: http
    category: exposed_service
    severity: MEDIUM
    service: http
    mode: safe
    requests:
      - method: GET
        path: /api/org
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - '"zipCode"'
          - type: word
            part: body
            words:
              - '"name"'
    finding:
      title: Grafana con acceso anónimo activo (paneles y fuentes de datos sin sesión)
      qod: 99
      confirmed: true
  # phpMyAdmin: la pantalla de login ya es el hallazgo — un gestor web de la
  # base de datos a la vista es un blanco de fuerza bruta. Las variables
  # pma_username/pma_password son del formulario de phpMyAdmin y no de una
  # pagina que solo lo mencione.
  - id: phpmyadmin-exposed
    version: 1
    type: http
    category: web_finding
    severity: MEDIUM
    service: http
    mode: safe
    payloads:
      pma_path:
        - /phpmyadmin/
        - /phpMyAdmin/
        - /pma/
    requests:
      - method: GET
        path: '{{pma_path}}'
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - phpMyAdmin
          - type: regex
            part: body
            regex:
              - 'name="pma_(?:username|password)"'
    finding:
      title: phpMyAdmin accesible (gestor web de la base de datos)
      qod: 99
      confirmed: true
  - id: adminer-exposed
    version: 1
    type: http
    category: web_finding
    severity: MEDIUM
    service: http
    mode: safe
    payloads:
      adminer_path:
        - /adminer.php
        - /adminer/
    requests:
      - method: GET
        path: '{{adminer_path}}'
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: regex
            part: body
            regex:
              - '<title>[^<]*Adminer'
          - type: regex
            part: body
            regex:
