  # que ellos, asi que la peticion se comparte. Cada patron es la forma
  # caracteristica de una pagina por defecto (el pie con la version de
  # Apache, el de nginx, la de Tomcat, la "Whitelabel" de Spring Boot, la de
  # IIS, la de Express); una pagina de error personalizada no trae ninguna.
