  # ---- GraphQL ---------------------------------------------------------
  # La introspección es una consulta de sólo lectura que el propio servidor
  # ofrece; devolver el esquema entero en producción regala a un atacante el
  # mapa completo de la API. Se busca ``"__schema":{`` y no la palabra suelta
  # porque un servidor con la introspección apagada la nombra en su error.
  - id: graphql-introspection-enabled
    version: 1
    type: http
    category: api_exposure
    severity: MEDIUM
    service: http
    mode: safe
    payloads:
      graphql_path:
        - /graphql
        - /api/graphql
        - /v1/graphql
    requests:
      - method: POST
        path: '{{graphql_path}}'
        headers:
          Content-Type: application/json
        body: '{"query":"{__schema{queryType{name} types{name}}}"}'
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: regex
            part: body
            regex:
              - '"__schema"\s*:\s*\{'
    finding:
      title: Introspección de GraphQL habilitada (el esquema completo es consultable)
      qod: 99
      confirmed: true
