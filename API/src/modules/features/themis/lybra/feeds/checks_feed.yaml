  # ---- Cookies de sesión sin atributos de seguridad -------------------
  # La regex mira una línea de cabecera que empieza por set-cookie, nombra una
  # cookie de sesión típica, y NO contiene "secure" — las tres condiciones en un
  # solo patrón para no depender del orden ni de matchers negativos separados.
  - id: session-cookie-without-secure
    version: 2
    type: http
    category: security_header
    severity: MEDIUM
    service: http
    mode: safe
    requests:
      - method: GET
        path: /
        matchers-condition: and
        matchers:
          - type: regex
            part: header
            regex:
              - '(?im)^set-cookie:\s*(?:PHPSESSID|JSESSIONID|ASP\.NET_SessionId|laravel_session|session|sessionid|connect\.sid|[0-9a-f]{32})=(?:(?!;\s*secure).)*$'
    finding:
      title: Cookie de sesion sin el atributo Secure
      qod: 99
      confirmed: true
  # Las mismas cookies de sesión, sin HttpOnly (legibles desde JavaScript,
  # y por tanto robables con un XSS) o sin SameSite (enviadas en peticiones
  # de otros sitios, la base de un CSRF).
  - id: session-cookie-without-httponly
    version: 1
    type: http
    category: security_header
    severity: MEDIUM
    service: http
    mode: safe
    requests:
      - method: GET
        path: /
        matchers-condition: and
        matchers:
