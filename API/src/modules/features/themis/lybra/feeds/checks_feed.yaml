      title: 'VNC: acceso sin autenticación (tipo de seguridad None ofrecido)'
      qod: 99
      confirmed: true
  # ===================================================================
  # SSH: el KEXINIT que el servidor envía en claro al conectar (la lista
  # de algoritmos que acepta). Nunca se completa el intercambio de claves
  # ni se autentica nada. Los cuatro de algoritmos débiles siguen el
  # criterio de OpenVAS, familia por familia.
  # ===================================================================
  - id: ssh-weak-mac
    version: 1
    type: script
    script: ssh-weak-mac
    category: network_config
    severity: LOW
    service: ssh
    mode: safe
    finding:
      title: 'SSH: acepta MACs débiles (MD5, 96 o 64 bits)'
      qod: 99
      confirmed: true
  - id: ssh-weak-encryption
    version: 1
    type: script
    script: ssh-weak-encryption
    category: network_config
    severity: MEDIUM
    service: ssh
    mode: safe
    finding:
      title: 'SSH: acepta cifrados débiles (CBC, RC4, 3DES)'
      qod: 99
      confirmed: true
  - id: ssh-weak-kex
    version: 1
    type: script
    script: ssh-weak-kex
    category: network_config
    severity: MEDIUM
    service: ssh
    mode: safe
    finding:
      title: 'SSH: acepta intercambios de claves débiles (SHA-1 o grupo DH 1)'
      qod: 99
      confirmed: true
  - id: ssh-weak-host-key
    version: 1
    type: script
    script: ssh-weak-host-key
    category: network_config
    severity: LOW
    service: ssh
    mode: safe
    finding:
      title: 'SSH: ofrece claves de host débiles (DSA o RSA con SHA-1)'
      qod: 99
      confirmed: true
  # Terrapin (CVE-2023-48795): la versión sólo dice que estaba afectada; el
  # KEXINIT dice si esta configuración lo está. Confirmador y refutador
  # corren sólo si la versión propuso la CVE.
  - id: ssh-terrapin-confirm
    version: 1
    type: script
    script: ssh-terrapin-confirm
    category: vulnerability
    severity: MEDIUM
    service: ssh
    mode: safe
    confirms: CVE-2023-48795
    finding:
      title: 'SSH: vulnerable a Terrapin (CVE-2023-48795), sin strict kex'
      qod: 99
      confirmed: true
  - id: ssh-terrapin-refute
    version: 1
    type: script
    script: ssh-terrapin-refute
    category: vulnerability
    severity: INFO
    service: ssh
    mode: safe
    refutes: CVE-2023-48795
    finding:
      title: 'SSH: no vulnerable a Terrapin (strict kex anunciado o sin modos afectados)'
      qod: 99
      confirmed: false
  # SMTP relay abierto: el servidor acepta un RCPT a un dominio externo desde un
  # remitente externo. No se llega a DATA — no se envía correo, sólo se observa
  # que aceptaría enrutarlo. Un servidor bien configurado responde 550/554.
  - id: smtp-open-relay
    version: 1
    type: network
    category: network_config
    severity: HIGH
    service: smtp
    mode: safe
    expectBanner: true
    requests:
      - send: "EHLO lybra.local\r\n"
        read: block
        matchers:
          - type: word
            part: body
            words:
              - '250'
      - send: "MAIL FROM:<probe@lybra-external.example>\r\n"
        read: block
        matchers:
          - type: word
            part: body
            words:
              - '250'
      - send: "RCPT TO:<relay-test@lybra-nonexistent-external.example>\r\n"
        read: block
        matchers:
          - type: word
            part: body
            words:
              - '250'
    finding:
      title: 'SMTP: relay abierto (acepta enrutar correo de terceros)'
      qod: 99
      confirmed: true
  # SMTP sin STARTTLS: el EHLO no anuncia STARTTLS entre sus capacidades, así
  # que las credenciales de autenticación viajarían en claro.
  - id: smtp-no-starttls
    version: 1
    type: network
    category: network_config
    severity: MEDIUM
    service: smtp
    mode: safe
    expectBanner: true
    requests:
      - send: "EHLO lybra.local\r\n"
        read: block
        matchers-condition: and
        matchers:
          - type: word
            part: body
            words:
              - '250'
          - type: word
            part: body
            words:
              - STARTTLS
            negative: true
    finding:
      title: 'SMTP: sin STARTTLS anunciado (autenticación en claro posible)'
      qod: 99
      confirmed: true
  # IMAP y POP3 sin paso a TLS: lo mismo que smtp-no-starttls, con la forma
  # de preguntar de cada protocolo. Sólo contra los puertos que empiezan en
  # claro (143 y 110): el 993 y el 995 cifran desde el primer byte.
  # IMAP: CAPABILITY contesta primero con una línea "* CAPABILITY ..." que
  # trae la lista entera, así que basta con leer esa línea.
  - id: imap-no-starttls
    version: 1
    type: network
    category: network_config
    severity: MEDIUM
    service: imap_starttls
    mode: safe
    expectBanner: true
    requests:
      - send: "a1 CAPABILITY\r\n"
        read: line
        matchers-condition: and
        matchers:
          - type: word
            part: body
            words:
              - '* CAPABILITY'
          - type: word
            part: body
            words:
              - STARTTLS
            negative: true
    finding:
      title: 'IMAP: sin STARTTLS anunciado (contraseñas de correo en claro)'
      qod: 99
      confirmed: true
  # POP3: CAPA (RFC 2449) contesta "+OK" y una capacidad por línea hasta un
  # "." solo; el paso a TLS se llama STLS. Un servidor que no conoce CAPA
  # contesta "-ERR" y el check no dispara: sin la lista no hay evidencia.
  - id: pop3-no-starttls
    version: 1
    type: network
    category: network_config
    severity: MEDIUM
    service: pop3_starttls
    mode: safe
    expectBanner: true
    requests:
      - send: "CAPA\r\n"
        read: dot-terminated
        matchers-condition: and
        matchers:
          - type: regex
            part: body
            regex:
              - '^\+OK'
          - type: regex
            part: body
            regex:
              - '(?m)^STLS\s*$'
            negative: true
    finding:
      title: 'POP3: sin STLS anunciado (contraseñas de correo en claro)'
      qod: 99
      confirmed: true
  # FTP sin cifrado: el servidor rechaza AUTH TLS, así que credenciales y datos
  # viajan en claro. Un servidor que soporta FTPS responde 234.
  - id: ftp-no-tls
    version: 1
    type: network
    category: network_config
    severity: MEDIUM
    service: ftp
    mode: safe
    expectBanner: true
    requests:
      - send: "AUTH TLS\r\n"
        read: block
        matchers:
          - type: regex
            part: body
            regex:
              - '^(?:500|502|504|530|534|431)'
    finding:
      title: 'FTP: sin cifrado disponible (AUTH TLS no soportado)'
      qod: 99
      confirmed: true
  # FTP que ofrece TLS sin exigirlo: responde 331 (pide la contraseña) a un
  # USER enviado sin AUTH TLS, así que la aceptaría en claro. Nunca se
  # envía PASS: el 331 ya es la prueba. Un servidor que exige TLS responde
  # 530/550/534. El usuario es inventado para no tocar ninguna cuenta real
  # ni el anónimo (ftp-anonymous-login ya cubre ése).
  - id: ftp-cleartext-login-allowed
    version: 1
    type: network
    category: network_config
    severity: MEDIUM
    service: ftp
    mode: safe
    expectBanner: true
    requests:
      - send: "USER lybra-cleartext-probe\r\n"
        read: block
        matchers:
          - type: regex
            part: body
            regex:
              - '^331'
    finding:
      title: 'FTP: acepta credenciales en claro (TLS ofrecido pero no exigido)'
      qod: 99
      confirmed: true
  # ===================================================================
  # Confirmadores (L29): ascienden una hipótesis por versión de
  # confirmed=false/qod=70 a confirmed=true/qod=99. Sólo corren si el
  # matcher de versiones ya propuso su CVE, y NUNCA explotan — comprueban
  # la condición sin ejecutar nada en el objetivo.
  # ===================================================================
  # CVE-2021-41773: path traversal de Apache 2.4.49. La prueba lee
  # /etc/passwd por la ruta vulnerable — una lectura, no una ejecución. Si
  # el cuerpo trae la línea de root, el fichero se sirvió: confirmado.
  - id: apache-cve-2021-41773-path-traversal
    version: 1
    type: http
    category: vulnerability
    severity: CRITICAL
    service: http
    mode: safe
    confirms: CVE-2021-41773
    requests:
      - method: GET
        path: /cgi-bin/.%2e/%2e%2e/%2e%2e/%2e%2e/%2e%2e/etc/passwd
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: regex
            part: body
            regex:
              - 'root:.*:0:0:'
    finding:
      title: 'Apache path traversal confirmado (CVE-2021-41773): /etc/passwd legible'
      qod: 99
      confirmed: true
  # CVE-2021-42013: el bypass del arreglo incompleto de 41773 en Apache
  # 2.4.50, con doble codificación de los puntos.
  - id: apache-cve-2021-42013-path-traversal
    version: 1
    type: http
    category: vulnerability
    severity: CRITICAL
    service: http
    mode: safe
    confirms: CVE-2021-42013
    requests:
      - method: GET
        path: /cgi-bin/.%%32%65/.%%32%65/.%%32%65/.%%32%65/etc/passwd
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: regex
            part: body
            regex:
              - 'root:.*:0:0:'
    finding:
      title: 'Apache path traversal confirmado (CVE-2021-42013): /etc/passwd legible'
      qod: 99
      confirmed: true
  # ---------------------------------------------------------------------------
  # PAYLOADS (L30) — una lista de valores sustituidos en la ruta, en vez de un
  # check por variación. Este busca un volcado de base de datos olvidado bajo
  # la raíz web: los nombres de fichero de copia de seguridad más habituales,
  # probados con una sola entrada de feed. El motor expande ``{{name}}`` una
  # vez por valor y corta en ``maxPayloadExpansions``, así que la lista puede
  # crecer sin volverse un barrido. Cualquiera que devuelva 200 con pinta de
  # volcado SQL dispara; un solo hallazgo, sea cual sea el que picó.
  - id: sql-dump-exposure
    version: 1
    type: http
    category: exposed_path
    severity: HIGH
    service: http
    mode: safe
    payloads:
      name:
        - backup.sql
        - dump.sql
        - database.sql
        - db.sql
        - backup.sql.gz
        - www.sql
        - site.sql
    requests:
      - method: GET
        path: /{{name}}
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - 'CREATE TABLE'
              - 'INSERT INTO'
              - 'DROP TABLE'
    finding:
      title: Volcado de base de datos SQL expuesto bajo la raíz web
      qod: 99
      confirmed: true
  # ---------------------------------------------------------------------------
  # CORS (L106) — una web deja a cualquier otra web leer sus respuestas con la
  # sesión del usuario. Sólo es grave cuando coinciden dos cosas a la vez:
  # el origen se acepta sin restricción Y las credenciales (cookies de sesión)
  # viajan con la petición. Aceptar cualquier origen sin credenciales es una
  # configuración habitual —y no es, por sí sola, el hallazgo.
  #
  # El primer caso (comodín) es literal: ambas cabeceras en una sola
  # respuesta. El segundo (reflejo) es el que motivó L103 — comparar dos
  # respuestas en vez de un plugin script: se manda dos orígenes distintos y
  # se comprueba que la cabecera de origen permitido refleja cada uno de los
  # dos, con ``compare`` confirmando que de verdad cambió entre una petición y
  # la otra.
  - id: cors-wildcard-origin-with-credentials
    version: 1
    type: http
    category: security_header
    severity: HIGH
    service: http
    mode: safe
    requests:
      - method: GET
        path: /
        headers:
          Origin: 'https://lybra-cors-probe.invalid'
        matchers-condition: and
        matchers:
          - type: word
            part: header
            words:
              - 'access-control-allow-origin: *'
          - type: word
            part: header
            words:
              - 'access-control-allow-credentials: true'
    finding:
      title: 'CORS: comodín de origen (*) y credenciales permitidas a la vez'
      qod: 99
      confirmed: true
  - id: cors-reflects-any-origin-with-credentials
    version: 1
    type: http
    category: security_header
    severity: HIGH
    service: http
    mode: safe
    payloads:
      originA:
        - https://lybra-cors-probe-a.invalid
      originB:
        - https://lybra-cors-probe-b.invalid
    requests:
      - method: GET
        path: /
        headers:
          Origin: '{{originA}}'
        matchers-condition: and
        matchers:
          - type: word
            part: header
            words:
              - 'access-control-allow-origin: {{originA}}'
          - type: word
            part: header
            words:
              - 'access-control-allow-credentials: true'
      - method: GET
        path: /
        headers:
          Origin: '{{originB}}'
        matchers-condition: and
        matchers:
          - type: word
            part: header
            words:
              - 'access-control-allow-origin: {{originB}}'
          - type: word
            part: header
            words:
              - 'access-control-allow-credentials: true'
          - type: compare
            part: header
            against: 0
            relation: differs
    finding:
      title: 'CORS: refleja cualquier origen con credenciales (Access-Control-Allow-Origin reflejado)'
      qod: 99
      confirmed: true
  # ---------------------------------------------------------------------------
  # L108 — lo que el rastreo ya descubre navegando alimenta a dos checks más:
  # copias de backup junto a un directorio real, y un formulario de acceso que
  # el rastreo encontró servido por HTTP en vez de HTTPS. El listado de
  # directorios sobre cada directorio descubierto es el mismo check de
  # siempre (``directory-listing-enabled``, arriba), sólo con
  # ``onDiscoveredDirectories`` añadido.
  - id: backup-file-near-discovered-directory
    version: 1
    type: http
    category: exposed_path
    severity: MEDIUM
    service: http
    mode: safe
    onDiscoveredDirectories: true
    payloads:
      name:
        - index.php.bak
        - index.php~
        - index.php.old
        - index.html.bak
        - default.aspx.bak
        - config.php.bak
        - config.php~
        - config.php.old
        - .htaccess.bak
        - web.config.bak
    requests:
      - method: GET
        path: /{{name}}
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
    finding:
      title: Copia de seguridad de un fichero olvidada junto a un directorio real
      qod: 99
      confirmed: true
  - id: login-form-served-over-http
    version: 1
    type: http
    category: security_header
    severity: MEDIUM
    service: http
    mode: safe
    # La ruta declarada aquí es un marcador: el runtime la sustituye entera
    # por cada formulario de acceso que el rastreo encontró navegando el
    # sitio (login_paths), porque no hay un sufijo fijo que anteponerle un
    # directorio — la ruta entera es lo que el rastreo descubrió.
    onDiscoveredPaths: true
    requests:
      - method: GET
        path: /lybra-discovered-login-placeholder
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: regex
            part: transport
            regex:
              - '^http->http$'
    finding:
      title: Formulario de acceso servido por HTTP sin redirección a HTTPS
      qod: 99
      confirmed: true
  - id: windows-shares-unauthenticated
    version: 1
    type: script
    script: windows-shares-unauthenticated
    category: exposed_service
    severity: HIGH
    service: smb
    mode: safe
    finding:
      title: Carpetas compartidas de Windows visibles sin ninguna credencial
      qod: 99
      confirmed: true
