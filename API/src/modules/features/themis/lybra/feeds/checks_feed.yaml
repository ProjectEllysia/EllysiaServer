  # X-Frame-Options está obsoleta: su sustituto es la directiva
  # frame-ancestors de la CSP. Sólo se avisa si la CSP no la trae.
  - id: x-frame-options-deprecated
    version: 1
    type: http
    category: security_header
    severity: INFO
    service: http
    mode: safe
    requests:
      - method: GET
        path: /
        matchers-condition: and
        matchers:
          - type: regex
            part: header
            regex:
              - '(?im)^x-frame-options:'
          - type: regex
            part: header
            regex:
              - '(?im)^content-security-policy:.*frame-ancestors'
            negative: true
    finding:
      title: X-Frame-Options sin frame-ancestors en la CSP (cabecera obsoleta)
      qod: 99
      confirmed: true
  # Cabeceras que regalan la versión exacta del software (X-Powered-By:
  # PHP/8.3.33, Server: nginx/1.18.0): acortan el trabajo de quien busca un
  # exploit para esa versión.
  - id: http-version-disclosure
    version: 1
    type: http
    category: security_header
    severity: LOW
    service: http
    mode: safe
    requests:
      - method: GET
        path: /
        matchers-condition: and
        matchers:
          - type: regex
            part: header
            regex:
              - '(?im)^(?:x-powered-by|server|x-aspnet-version|x-aspnetmvc-version):[^\n]*\d+\.\d+'
    finding:
      title: Las cabeceras HTTP revelan la versión del software
      qod: 99
      confirmed: true
  # BREACH: compresión HTTP sobre HTTPS en una respuesta que pone cookies.
  # Comparando tamaños de respuestas comprimidas se pueden deducir secretos
  # de la página. Se pide con Accept-Encoding porque urllib no lo envía.
  - id: http-compression-breach
    version: 1
    type: http
    category: security_header
    severity: LOW
    service: http
    mode: safe
    requests:
      - method: GET
        path: /
        headers:
          Accept-Encoding: gzip, deflate, br
        matchers-condition: and
        matchers:
          - type: regex
            part: transport
            regex:
              - '->https$'
          - type: regex
            part: header
            regex:
              - '(?im)^content-encoding:\s*(?:gzip|deflate|br)'
          - type: regex
            part: header
            regex:
              - '(?im)^set-cookie:'
    finding:
      title: Compresión HTTP sobre HTTPS con cookies (posible BREACH)
      qod: 70
      confirmed: false
  # ===================================================================
  # Checks de configuración de red que la Fase N prometió (L26). Cierran
  # la parte de la brecha G1 que no se resuelve escribiendo ojos: una
  # configuración insegura no tiene CVE y no aparece por la vía de la
  # versión. Alguien tiene que ir y preguntarla.
  # ===================================================================
  - id: telnet-enabled
    version: 1
    type: script
    script: telnet-enabled
    category: network_config
    severity: HIGH
    service: telnet
    mode: safe
    finding:
      title: 'Telnet: servicio activo (credenciales en claro por diseño)'
      qod: 99
      confirmed: true
  - id: vnc-no-authentication
    version: 1
    type: script
    script: vnc-no-authentication
    category: default_credentials
    severity: CRITICAL
    service: vnc
    mode: safe
    finding:
      title: 'VNC: acceso sin autenticación (tipo de seguridad None ofrecido)'
      qod: 99
      confirmed: true
  # ===================================================================
  # SSH: el KEXINIT que el servidor envía en claro al conectar (la lista
  # de algoritmos que acepta). Nunca se completa el intercambio de claves
  # ni se autentica nada. Los cuatro de algoritmos débiles siguen el
  # criterio de OpenVAS, familia por familia.
  # ===================================================================
  - id: ssh-weak-mac
    version: 1
    type: script
    script: ssh-weak-mac
    category: network_config
    severity: LOW
    service: ssh
    mode: safe
    finding:
      title: 'SSH: acepta MACs débiles (MD5, 96 o 64 bits)'
      qod: 99
      confirmed: true
  - id: ssh-weak-encryption
    version: 1
    type: script
    script: ssh-weak-encryption
    category: network_config
    severity: MEDIUM
    service: ssh
    mode: safe
    finding:
      title: 'SSH: acepta cifrados débiles (CBC, RC4, 3DES)'
      qod: 99
      confirmed: true
  - id: ssh-weak-kex
    version: 1
    type: script
    script: ssh-weak-kex
    category: network_config
    severity: MEDIUM
    service: ssh
    mode: safe
    finding:
      title: 'SSH: acepta intercambios de claves débiles (SHA-1 o grupo DH 1)'
      qod: 99
      confirmed: true
  - id: ssh-weak-host-key
    version: 1
    type: script
    script: ssh-weak-host-key
    category: network_config
    severity: LOW
    service: ssh
    mode: safe
    finding:
      title: 'SSH: ofrece claves de host débiles (DSA o RSA con SHA-1)'
      qod: 99
