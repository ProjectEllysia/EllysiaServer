            part: header
            regex:
              - '(?im)^set-cookie:\s*(?:PHPSESSID|JSESSIONID|ASP\.NET_SessionId|laravel_session|session|sessionid|connect\.sid|[0-9a-f]{32})=(?:(?!;\s*httponly).)*$'
    finding:
