# Feed de checks declarativos de Lybra (roadmap Fase R).
#
# YAML y no JSON a proposito: es el formato de las plantillas de Nuclei, con
# las que este esquema se disena para ser razonablemente compatible, y admite
# comentarios — que en un feed de reglas es la diferencia entre poder explicar
# por que un check existe y no poder.
#
# feedVersion sube cuando el feed gana una familia nueva o un protocolo nuevo
# bajo una existente; el arreglo de un check ya presente sube el 'version' de
# ese check, no esta cadena. Ver CHECKS_FEED_VERSION en checks.py.
feedVersion: lybra-checks-24
checks:
  - id: git-config-exposure
    version: 1
    type: http
    category: exposed_path
    severity: HIGH
    service: http
    mode: safe
    requests:
      - method: GET
        path: /.git/config
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - '[core]'
              - repositoryformatversion
    finding:
      title: Repositorio Git expuesto (.git/config accesible)
      qod: 99
      confirmed: true
  - id: dotenv-exposure
    version: 1
    type: http
    category: exposed_path
    severity: HIGH
    service: http
    mode: safe
    requests:
      - method: GET
        path: /.env
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: regex
            part: body
            regex:
              - (?m)^[A-Z][A-Z0-9_]*=
    finding:
      title: Fichero .env expuesto (posibles secretos accesibles)
      qod: 99
      confirmed: true
  - id: phpinfo-exposure
    version: 1
    type: http
    category: exposed_path
    severity: HIGH
    service: http
    mode: safe
    requests:
      - method: GET
        path: /phpinfo.php
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - phpinfo()
              - PHP Version
    finding:
      title: phpinfo() expuesto (revela configuración interna del servidor)
      qod: 99
      confirmed: true
  - id: wpconfig-source-exposure
    version: 1
    type: http
    category: exposed_path
    severity: CRITICAL
    service: http
    mode: safe
    requests:
      - method: GET
        path: /wp-config.php
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - DB_PASSWORD
              - DB_NAME
    finding:
      title: wp-config.php servido como texto plano (credenciales de BD expuestas)
      qod: 99
      confirmed: true
  # ---------------------------------------------------------------------------
  # JOOMLA — la superficie conocida del segundo CMS más usado, con peticiones de
  # sólo lectura. Cada check exige una marca propia de Joomla en el cuerpo: un
  # sitio que contesta 200 a cualquier ruta no dispara ninguno.
  #
  # configuration.php guarda las credenciales de la base de datos. PHP lo
  # ejecuta y nunca lo sirve, pero una copia de editor se sirve como texto.
  - id: joomla-configuration-backup
    version: 1
    type: http
    category: exposed_path
    severity: HIGH
    service: http
    mode: safe
    payloads:
      name:
        - configuration.php~
        - configuration.php.bak
        - configuration.php.old
        - configuration.php.save
        - configuration.php.swp
        - configuration.php.orig
        - configuration.php.txt
        - configuration.bak
    requests:
      - method: GET
        path: /{{name}}
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - class JConfig
    finding:
      title: Copia de configuration.php de Joomla servida como texto (credenciales de BD expuestas)
      qod: 99
      confirmed: true
  # El instalador olvidado: en algunas versiones permite reinstalar el sitio
  # encima del existente.
  - id: joomla-installation-directory
    version: 1
    type: http
    category: exposed_path
    severity: MEDIUM
    service: http
    mode: safe
    requests:
      - method: GET
        path: /installation/index.php
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: regex
            part: body
            regex:
              - '(?i)joomla!?[^<]{0,30}(?:web\s*)?install(?:er|ation)'
    finding:
      title: El directorio de instalación de Joomla sigue publicado
      qod: 95
      confirmed: true
  # El panel de administración a la vista: no es un fallo, pero sí superficie
  # expuesta que el informe tiene que contar.
  - id: joomla-admin-exposed
    version: 1
    type: http
    category: exposed_path
    severity: INFO
    service: http
    mode: safe
    requests:
      - method: GET
        path: /administrator/
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - com_login
    finding:
      title: Panel de administración de Joomla accesible desde Internet
      qod: 95
      confirmed: true
  # CVE-2023-23752 (KEV): en Joomla 4.0.0–4.2.7 la API web devuelve la
  # configuración, credenciales incluidas, sin autenticar. Confirmador: sólo
  # corre si la versión detectada ya propuso la CVE. Se confirma porque la
  # respuesta trae la configuración; lo que devuelve no se usa para nada.
  - id: joomla-cve-2023-23752-api-config
    version: 1
    type: http
    category: vulnerability
    severity: CRITICAL
    service: http
    mode: safe
    confirms: CVE-2023-23752
    requests:
      - method: GET
        path: /api/index.php/v1/config/application?public=true
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: regex
            part: body
            regex:
              - '"type"\s*:\s*"application"'
          - type: word
            part: body
            words:
              - '"password"'
              - '"dbtype"'
    finding:
      title: 'Joomla expone su configuración sin autenticar (CVE-2023-23752)'
      qod: 99
      confirmed: true
  # ---------------------------------------------------------------------------
  # WORDPRESS — lo que el wp-config de arriba no cubre. Sólo lectura, y cada
  # check exige una marca propia de WordPress en la respuesta.
  #
  # Una copia de editor de wp-config.php se sirve como texto.
  - id: wordpress-config-backup
    version: 1
    type: http
    category: exposed_path
    severity: CRITICAL
    service: http
    mode: safe
    payloads:
      name:
        - wp-config.php~
        - wp-config.php.bak
        - wp-config.php.old
        - wp-config.php.save
        - wp-config.php.swp
        - wp-config.php.orig
        - wp-config.php.txt
        - wp-config.bak
    requests:
      - method: GET
        path: /{{name}}
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - DB_PASSWORD
    finding:
      title: Copia de wp-config.php servida como texto (credenciales de BD expuestas)
      qod: 99
      confirmed: true
  # Un WordPress sin instalar: quien llegue primero lo configura y se queda
  # con el sitio (y con lo que el servidor le deje ejecutar).
  - id: wordpress-install-exposed
    version: 1
    type: http
    category: exposed_path
    severity: HIGH
    service: http
    mode: safe
    requests:
      - method: GET
        path: /wp-admin/install.php
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - weblog_title
    finding:
      title: WordPress sin instalar y con el instalador abierto
      qod: 95
      confirmed: true
  # El registro de depuración, que WP_DEBUG_LOG deja en una ruta pública:
  # rutas del servidor, consultas y a veces datos de usuarios.
  - id: wordpress-debug-log
    version: 1
    type: http
    category: exposed_path
    severity: MEDIUM
    service: http
    mode: safe
    requests:
      - method: GET
        path: /wp-content/debug.log
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: regex
            part: body
            regex:
              - 'PHP (?:Warning|Notice|Fatal error|Deprecated|Parse error):'
    finding:
      title: Registro de depuración de WordPress público (wp-content/debug.log)
      qod: 95
      confirmed: true
  # La API REST lista los usuarios con su nombre de acceso (slug): la mitad
  # de un ataque de fuerza bruta resuelta.
  - id: wordpress-user-enumeration
    version: 1
    type: http
    category: web_finding
    severity: LOW
    service: http
    mode: safe
    requests:
      - method: GET
        path: /wp-json/wp/v2/users
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: regex
            part: body
            regex:
              - '"slug"\s*:\s*"[^"]+"'
          - type: word
            part: body
            words:
              - '"avatar_urls"'
    finding:
      title: WordPress publica sus nombres de usuario en la API REST
      qod: 95
      confirmed: true
  # XML-RPC activo: permite probar cientos de contraseñas en una sola
  # petición (system.multicall) y usar el sitio para pingbacks.
  - id: wordpress-xmlrpc-enabled
    version: 1
    type: http
    category: exposed_path
    severity: LOW
    service: http
    mode: safe
    requests:
      - method: GET
        path: /xmlrpc.php
        matchers-condition: and
        matchers:
          - type: word
            part: body
            words:
              - XML-RPC server accepts POST requests only
    finding:
      title: XML-RPC de WordPress activo (fuerza bruta amplificada y pingbacks)
      qod: 95
      confirmed: true
  # El directorio de subidas listable: todo lo que se subió, publicado o no.
  - id: wordpress-uploads-listing
    version: 1
    type: http
    category: exposed_path
    severity: LOW
    service: http
    mode: safe
    requests:
      - method: GET
        path: /wp-content/uploads/
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - Index of /wp-content/uploads
    finding:
      title: El directorio de subidas de WordPress se puede listar
      qod: 99
      confirmed: true
  # ---------------------------------------------------------------------------
  # DRUPAL — la misma idea: sólo lectura y una marca de Drupal en el cuerpo.
  #
  # settings.php guarda la conexión a la base de datos; una copia de editor
  # se sirve como texto.
  - id: drupal-settings-backup
    version: 1
    type: http
    category: exposed_path
    severity: CRITICAL
    service: http
    mode: safe
    payloads:
      name:
        - settings.php~
        - settings.php.bak
        - settings.php.old
        - settings.php.save
        - settings.php.swp
        - settings.php.orig
        - settings.php.txt
    requests:
      - method: GET
        path: /sites/default/{{name}}
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - $databases
    finding:
      title: Copia de settings.php de Drupal servida como texto (credenciales de BD expuestas)
      qod: 99
      confirmed: true
  # Un Drupal sin instalar, con el instalador abierto a cualquiera.
  - id: drupal-install-exposed
    version: 1
    type: http
    category: exposed_path
    severity: HIGH
    service: http
    mode: safe
    payloads:
      name:
        - core/install.php
        - install.php
    requests:
      - method: GET
        path: /{{name}}
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - install-page
          - type: word
            part: body
            words:
              - Drupal already installed
            negative: true
    finding:
      title: Drupal sin instalar y con el instalador abierto
      qod: 95
      confirmed: true
  # CHANGELOG.txt da la versión exacta del núcleo a cualquiera.
  - id: drupal-changelog-exposed
    version: 1
    type: http
    category: web_finding
    severity: LOW
    service: http
    mode: safe
    payloads:
      name:
        - CHANGELOG.txt
        - core/CHANGELOG.txt
    requests:
      - method: GET
        path: /{{name}}
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: regex
            part: body
            regex:
              - '(?m)^Drupal \d+\.\d+'
    finding:
      title: El CHANGELOG.txt de Drupal revela la versión exacta
      qod: 99
      confirmed: true
  # JSON:API con la colección de usuarios abierta: nombres de cuenta, y a
  # veces correos, sin autenticar.
  - id: drupal-jsonapi-user-enumeration
    version: 1
    type: http
    category: web_finding
    severity: MEDIUM
    service: http
    mode: safe
    requests:
      - method: GET
        path: /jsonapi/user/user
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - '"type":"user--user"'
    finding:
      title: La JSON:API de Drupal lista los usuarios sin autenticar
      qod: 95
      confirmed: true
  - id: ssh-private-key-exposure
    version: 1
    type: http
    category: exposed_path
    severity: CRITICAL
    service: http
    mode: safe
    requests:
      - method: GET
        path: /id_rsa
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - PRIVATE KEY-----
    finding:
      title: Clave privada SSH expuesta
      qod: 99
      confirmed: true
  - id: sql-backup-exposure
    version: 1
    type: http
    category: exposed_path
    severity: CRITICAL
    service: http
    mode: safe
    requests:
      - method: GET
        path: /backup.sql
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - INSERT INTO
              - CREATE TABLE
              - -- MySQL dump
    finding:
      title: Volcado de base de datos (.sql) expuesto
      qod: 99
      confirmed: true
  - id: apache-server-status-exposure
    version: 1
    type: http
    category: exposed_path
    severity: MEDIUM
    service: http
    mode: safe
    requests:
      - method: GET
        path: /server-status
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - Apache Server Status
    finding:
      title: mod_status de Apache expuesto (server-status revela peticiones y rutas internas)
      qod: 99
      confirmed: true
  - id: missing-hsts-header
    version: 2
    type: http
    category: security_header
    severity: MEDIUM
    service: http
    mode: safe
    requests:
      - method: GET
        path: /
        matchers-condition: and
        matchers:
          # HSTS sólo tiene efecto recibida por HTTPS (RFC 6797 §8.1): por HTTP
          # en claro el navegador la ignora, así que exigirla ahí es un error.
          - type: regex
            part: transport
            regex:
              - '->https$'
          - type: status
            value:
              - 200
              - 301
              - 302
          - type: word
            part: header
            words:
              - strict-transport-security
            negative: true
    finding:
      title: Cabecera HSTS (Strict-Transport-Security) ausente
      qod: 99
      confirmed: true
  - id: missing-x-frame-options-header
    version: 2
    type: http
    category: security_header
    severity: MEDIUM
    service: http
    mode: safe
    requests:
      - method: GET
        path: /
        matchers-condition: and
        matchers:
          # Un puerto en claro que redirige a HTTPS no sirve ninguna página: sus
          # cabeceras se evalúan en el servicio HTTPS, no aquí por duplicado.
          - type: word
            part: transport
            words:
              - http->https
            negative: true
          - type: status
            value:
              - 200
              - 301
              - 302
          - type: word
            part: header
            words:
              - x-frame-options
            negative: true
    finding:
      title: Cabecera X-Frame-Options ausente (posible clickjacking)
      qod: 99
      confirmed: true
  - id: missing-x-content-type-options-header
    version: 2
    type: http
    category: security_header
    severity: LOW
    service: http
    mode: safe
    requests:
      - method: GET
        path: /
        matchers-condition: and
        matchers:
          # Un puerto en claro que redirige a HTTPS no sirve ninguna página: sus
          # cabeceras se evalúan en el servicio HTTPS, no aquí por duplicado.
          - type: word
            part: transport
            words:
              - http->https
            negative: true
          - type: status
            value:
              - 200
              - 301
              - 302
          - type: word
            part: header
            words:
              - x-content-type-options
            negative: true
    finding:
      title: Cabecera X-Content-Type-Options ausente (permite MIME sniffing)
      qod: 99
      confirmed: true
  - id: tls-self-signed-cert
    version: 1
    type: tls
    category: tls
    severity: MEDIUM
    service: https
    mode: safe
    tlsRule: self_signed
    finding:
      title: Certificado TLS autofirmado
      qod: 99
      confirmed: true
  # Sólo cuando se escaneó por nombre: el certificado no cubre el nombre
  # pedido, así que cualquier navegador mostrará un aviso. Por IP no hay
  # nombre con el que comparar y el check no dispara.
  - id: tls-hostname-mismatch
    version: 1
    type: tls
    category: tls
    severity: MEDIUM
    service: https
    mode: safe
    tlsRule: hostname_mismatch
    finding:
      title: El certificado TLS no cubre el nombre del sitio
      qod: 99
      confirmed: true
  - id: tls-expired-cert
    version: 1
    type: tls
    category: tls
    severity: HIGH
    service: https
    mode: safe
    tlsRule: expired
    finding:
      title: Certificado TLS caducado
      qod: 99
      confirmed: true
  - id: tls-deprecated-protocol
    version: 1
    type: tls
    category: tls
    severity: MEDIUM
    service: https
    mode: safe
    tlsRule: deprecated_protocol
    finding:
      title: Protocolo TLS obsoleto negociado (SSLv3/TLSv1.0/TLSv1.1)
      qod: 99
      confirmed: true
  # expectBanner: un servidor FTP saluda (220 ...) en cuanto se abre la
  # conexion, sin que el cliente pida nada. Ese saludo hay que consumirlo antes
  # de escribir USER; si se deja en el buffer, la respuesta que se lee tras
  # USER es el saludo y no el 331, y el check no dispara jamas.
  # read: block — el saludo y las respuestas de FTP pueden venir en varias
  # lineas (220-... / 220 ...), asi que el fin de la respuesta es "la primera
  # linea cuyo codigo NO lleva guion", no "el primer salto de linea".
  - id: ftp-anonymous-login
    version: 2
    type: network
    category: default_credentials
    severity: HIGH
    service: ftp
    mode: safe
    expectBanner: true
    requests:
      - send: "USER anonymous\r\n"
        read: block
        matchers-condition: and
        matchers:
          - type: word
            part: body
            words:
              - '331'
      - send: "PASS anonymous@lybra.local\r\n"
        read: block
        matchers-condition: and
        matchers:
          - type: word
            part: body
            words:
              - '230'
    finding:
      title: 'FTP: login anónimo permitido'
      qod: 99
      confirmed: true
  # Redis no saluda: no lleva expectBanner. Lo que si tiene es una respuesta
  # que no termina en el primer salto de linea — INFO devuelve un "bulk string"
  # RESP, es decir una linea con la longitud ($3116) seguida de esos bytes. Con
  # read: line se leia "$3116" y se buscaba redis_version ahi dentro, que
  # nunca esta. Una respuesta que no sea bulk (el error -NOAUTH, por ejemplo)
  # vuelve tal cual, que es justo lo que el matcher negativo necesita ver.
  - id: redis-unauthenticated-access
    version: 2
    type: network
    category: default_credentials
    severity: CRITICAL
    service: redis
    mode: safe
    requests:
      - send: "INFO\r\n"
        read: resp-bulk
        matchers-condition: and
        matchers:
          - type: word
            part: body
            words:
              - redis_version
          - type: word
            part: body
            words:
              - NOAUTH
            negative: true
    finding:
      title: 'Redis: acceso sin autenticación (comando INFO permitido)'
      qod: 99
      confirmed: true
  - id: smb-signing-not-required
    version: 1
    type: script
    script: smb-signing-not-required
    category: network_config
    severity: MEDIUM
    service: smb
    mode: safe
    finding:
      title: 'SMB: firma de mensajes no requerida'
      qod: 99
      confirmed: true
  # ------------------------------------------------------------------
  # APIs de administracion expuestas sin autenticar (L17).
  #
  # Los tres checks de aqui abajo comparten una forma y una razon. La forma:
  # un GET sin credenciales que exige un 200 con contenido reconocible del
  # producto. La razon: en estos tres servicios, que la peticion conteste
  # **es** el hallazgo, y de los graves.
  #
  # El 200 no es un adorno del matcher, es la mitad del check. Un 401 o un 403
  # significan que el servicio esta ahi y pide credenciales — que es como debe
  # estar — y por eso no producen hallazgo ninguno.
  - id: docker-api-unauthenticated
    version: 1
    type: http
    category: exposed_service
    severity: CRITICAL
    service: docker
    mode: safe
    requests:
      - method: GET
        path: /version
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - ApiVersion
              - GoVersion
    finding:
      title: API de Docker expuesta sin autenticacion (ejecucion remota de codigo como root)
      qod: 99
      confirmed: true
  - id: elasticsearch-unauthenticated
    version: 1
    type: http
    category: exposed_service
    severity: CRITICAL
    service: elasticsearch
    mode: safe
    requests:
      - method: GET
        path: /_cluster/health
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - cluster_name
              - number_of_nodes
    finding:
      title: Cluster de Elasticsearch accesible sin autenticacion (lectura y borrado de todos los indices)
      qod: 99
      confirmed: true
  - id: kubernetes-anonymous-api
    version: 1
    type: http
    category: exposed_service
    severity: CRITICAL
    service: kubernetes
    mode: safe
    requests:
      - method: GET
        path: /api/v1/namespaces
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - NamespaceList
    finding:
      title: API de Kubernetes accesible de forma anonima (inventario y control del cluster)
      qod: 99
      confirmed: true
  - id: postgres-trust-authentication
    version: 1
    type: script
    script: postgres-trust-authentication
    category: default_credentials
    severity: CRITICAL
    service: postgres
    mode: safe
    finding:
      title: 'PostgreSQL: acepta conexiones de red sin contrasena (modo trust)'
