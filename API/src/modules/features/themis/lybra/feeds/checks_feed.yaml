  # ---- Higiene TLS: cifrado débil negociado ---------------------------
  # version 2: se ofrecen solo cifrados debiles en vez de mirar el negociado.
  # Lo que se puede ofrecer depende del OpenSSL local: en la practica NULL y,
  # si la build lo trae, 3DES; RC4, DES y EXPORT no los tiene ninguna build
  # moderna, y el titulo no los promete.
