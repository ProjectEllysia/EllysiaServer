  # etcd no sirve de prueba con su /version: esa ruta contesta sin
  # credenciales aunque la autenticacion este activa. Lo que si la exige es
  # leer claves, asi que se pide un rango de una sola clave, sin su valor
  # (keys_only). La clave "\0" con range_end "\0" es "desde el principio del
  # espacio de claves"; limit 1 lo deja en una. Es un POST porque la pasarela
  # HTTP de etcd v3 solo acepta POST, pero es una lectura: range no escribe.
  # Con autenticacion activa etcd contesta un error (sin cabecera de cluster)
  # y el 200 no llega.
  - id: etcd-unauthenticated-access
    version: 1
    type: http
    category: exposed_service
    severity: CRITICAL
    service: etcd
    mode: safe
    requests:
      - method: POST
        path: /v3/kv/range
        headers:
          Content-Type: application/json
        body: '{"key":"AA==","range_end":"AA==","limit":1,"keys_only":true}'
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - cluster_id
              - raft_term
    finding:
      title: etcd accesible sin autenticacion (lectura de toda la configuracion del cluster, secretos incluidos)
      qod: 99
      confirmed: true
