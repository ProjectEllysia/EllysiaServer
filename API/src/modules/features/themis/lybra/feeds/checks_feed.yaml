  # HSTS con un max-age de menos de seis meses (15552000 s): protege tan poco
  # tiempo que un primer acceso por HTTP vuelve a quedar expuesto enseguida.
  - id: hsts-weak-max-age
    version: 1
    type: http
    category: security_header
    severity: LOW
    service: http
    mode: safe
    requests:
      - method: GET
        path: /
        matchers-condition: and
        matchers:
          - type: regex
            part: transport
            regex:
              - '->https$'
          - type: regex
            part: header
            regex:
              - '(?im)^strict-transport-security:.*max-age=(?:\d{1,7}|1[0-4]\d{6}|15[0-4]\d{5}|155[0-4]\d{4}|1555[01]\d{3})\b'
    finding:
