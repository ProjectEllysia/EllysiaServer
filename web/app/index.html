    <!-- Valores de la portada, que es lo que ve quien no ejecuta JavaScript
         (vistas previas de enlaces, buscadores sin renderizado). Cada ruta los
         reemplaza al navegar: ver src/composables/useSeo.js. La canónica la pone
         solo ese composable, porque aquí valdría para cualquier URL. Al construir,
         scripts/seoPrerender.mjs genera además una copia de este fichero por ruta
         pública, con su título, su descripción y su canónica. -->
    <meta name="description" content="Cinco herramientas de ciberseguridad: escaneo de vulnerabilidades, detección de phishing, concienciación, bóveda de contraseñas cifrada y monitorización de servidores." />
    <title>Ellysia · Escáner de vulnerabilidades, phishing y bóveda cifrada</title>

    <meta property="og:site_name" content="Ellysia" />
    <meta property="og:locale" content="es_ES" />

    <!-- Imagen de 1200×630 al verse el enlace en una red o mensajería. Va con URL
         absoluta porque esas redes no resuelven rutas relativas. -->

    <meta property="og:image:width" content="1200" />

  </head>
